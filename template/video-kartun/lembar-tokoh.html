<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
html,body{margin:0;width:3600px;height:1500px;background:#FCF5EB;font-family:P}</style></head><body>
<svg id="s" width="3600" height="1500" viewBox="0 0 3600 1500"></svg>
<script src="hidup.js"></script><script src="tokoh.js"></script>
<script>
const tx=(x,y,s,t,c='#173336')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="P" font-weight="700" font-size="${s}" fill="${c}">${t}</text>`;
let h=tx(1800,90,56,'Lembar tokoh: badan penuh + ekspresi');
const F=[['senang',{mouth:'open',eye:'happy',brow:8}],['kaget',{mouth:'o',eye:'wide'}],['bingung',{mouth:'flat',brow:2,browTilt:14,look:[6,-3]}],['sedih',{mouth:'sad',brow:-2,browTilt:-16,look:[0,5]}],['kedip',{blink:.1}]];
[['rara','Rara',360,{tilt:-5,armR:-140,armL:14,face:{mouth:'open',brow:6}}],['bimo','Bimo',1080,{tilt:6,armL:150,legL:8,legR:-6,face:{mouth:'open',brow:6}}],['jaka','Bos Jaka',1800,{tilt:3,armL:30,armR:-20,propL:T.cangkir(30,0),face:{mouth:'smile',brow:3}}],['acong','Pak Acong',2520,{tilt:-3,armL:40,armR:-14,propL:T.nota(40),face:{brow:0,browTilt:12}}],['yanti','Bu Yanti (baru)',3240,{tilt:-7,lean:3,armL:95,armR:88,propL:T.hp(95,'bingung'),kacamata:.9,face:{mouth:'o',brow:-1,browTilt:12,look:[-7,4],blink:.55}}]].forEach(([k,n,x,o])=>{
  h+=`<rect x="${x-330}" y="130" width="660" height="1330" rx="40" fill="#fff"/>`+tx(x,200,44,n,'#15787D');
  h+=T[k](x,440,.95,o);
  F.forEach(([lab,f],i)=>{const cx=x-250+i*125; h+=`<g>${T[k](cx,1180,.42,{legs:false,shadow:false,armL:0,armR:0,face:f})}</g><rect x="${cx-62}" y="1262" width="124" height="190" fill="#fff"/>`+tx(cx,1310,24,lab);});
});
document.getElementById('s').innerHTML=h;
</script></body></html>
