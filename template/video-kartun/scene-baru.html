<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf);font-weight:400}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F6EAD6;font-family:P}
#stage{position:absolute;inset:0;overflow:hidden}
.ov{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#16202A;color:#fff;border-radius:22px;padding:16px 34px;text-align:center;z-index:40}
.ov .h{font-weight:700;font-size:30px;display:flex;gap:12px;align-items:center;justify-content:center}
.ov .tag{background:#FFD45C;color:#16202A;border-radius:8px;padding:1px 10px;font-size:22px}
.ov .w{font-weight:400;font-size:24px;opacity:.9;margin-top:2px}
.cap{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:700;color:#173336;font-size:74px;line-height:1.2;z-index:15}
.phone{position:absolute;left:50%;top:500px;width:600px;height:480px;margin-left:-300px;background:#16202A;border-radius:56px;padding:18px;box-sizing:border-box;z-index:12;box-shadow:0 30px 60px rgba(0,0,0,.25);opacity:0}
.scr{background:#fff;border-radius:40px;width:100%;height:100%;padding:34px 26px;box-sizing:border-box}
.scr .t{font-weight:700;font-size:30px;color:#173336}
.scr .s{font-size:20px;color:#7a8580;margin-bottom:18px}
.room{display:flex;align-items:center;gap:16px;border:2px solid #eee6da;border-radius:20px;padding:14px;margin-bottom:14px;position:relative}
.room .sw{width:64px;height:52px;border-radius:12px}
.room .n{font-weight:700;font-size:24px;color:#173336}
.room .p{font-size:18px;color:#7a8580}
.badge{position:absolute;right:14px;top:50%;background:#FD5B35;color:#fff;font-weight:700;font-size:20px;border-radius:12px;padding:6px 14px;transform:translateY(-50%) scale(0)}
.cta{position:absolute;inset:0;background:#13343B;z-index:30;opacity:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;color:#fff;padding-top:400px;box-sizing:border-box}
.cta .big{font-weight:700;font-size:72px;text-align:center;line-height:1.15}
.cta .btn{margin-top:56px;background:#FD5B35;border-radius:60px;padding:28px 64px;font-weight:700;font-size:52px}
.cta .url{margin-top:38px;font-weight:700;font-size:44px}
.cta .sm{margin-top:16px;font-size:30px;opacity:0}
svg.full{position:absolute;inset:0}
</style></head><body><div id="stage">
<div class="ov"><div class="h"><span class="tag">IG</span><span class="tag">TikTok</span>@tk.penginapan</div><div class="w">titikkumpul.id/layanan-penginapan</div></div>
<div class="cap" id="cap"></div>

<svg id="scene" class="full" width="1080" height="1920" viewBox="0 0 1080 1920">
  <g id="cam"><g id="gBack"></g><g id="gRara"></g><g id="gMeja"></g><g id="gKoper"></g><g id="gBimo"></g><g id="fx"></g><g id="gDepan"></g></g>
  <g id="gTepi"></g>
</svg>

<div class="phone" id="phone"><div class="scr">
  <div class="t">Homestay Anda</div><div class="s">24 – 26 Des · 2 tamu</div>
  <div class="room"><div class="sw" style="background:#7fc8c2"></div><div><div class="n">Kamar Standar</div><div class="p">Rp250.000/malam</div></div><div class="badge" id="b1">Penuh</div></div>
  <div class="room"><div class="sw" style="background:#f6b98a"></div><div><div class="n">Kamar Deluxe</div><div class="p">Rp350.000/malam</div></div><div class="badge" id="b2">Penuh</div></div>
  <div class="room"><div class="sw" style="background:#d9d4cc"></div><div><div class="n">Kamar Keluarga</div><div class="p">Rp500.000/malam</div></div><div class="badge" id="b3">Penuh</div></div>
</div></div>
<svg id="fxTop" class="full" width="1080" height="1920" viewBox="0 0 1080 1920" style="z-index:20;pointer-events:none"></svg>

<div class="cta" id="cta">
  <div class="big" id="ctaBig"></div>
  <div class="btn" id="ctaBtn">Coba demo gratis</div>
  <div class="url" id="ctaUrl">titikkumpul.id/layanan-penginapan</div>
  <div class="sm" id="ctaSm">TK Penginapan · mulai Rp149rb/bulan</div>
  <svg id="ctaSvg" class="full" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="gJaka"></g><g id="fxCta"></g></svg>
</div>
</div>
<script src="hidup.js"></script>
<script src="tokoh.js"></script>
<script src="latar.js"></script>
<script>
/* Template video kartun (versi baru): hidup.js + tokoh.js + latar.js.
   Durasi 9 detik, waktu kejadian sama dengan scene.html lama supaya sound.py tetap pas.
   Salin file ini untuk episode baru, lalu ubah teks, waktu, dan aksi di setT. */
const $=id=>document.getElementById(id);
const {cl,seg,io,out,back,elastic,spring,lerp}=H;
const SET=L.resepsionis, FX=$('fx'), TOP=$('fxTop');
$('gBack').innerHTML=SET.belakang(); $('gMeja').innerHTML=SET.meja(); $('gDepan').innerHTML=SET.depan(); $('gTepi').innerHTML=SET.tepi();

const RX=320, RY=1085, RS=1.22;          // Rara di balik meja
const BY=1055, BS=1.16, FLOOR=BY+T.KAKI*BS; // Bimo berdiri di lantai
const bimoX=t=>lerp(1440,790,io(seg(t,.3,2.2)));
const STEPS=H.footfalls(.9,2.2,12);
const BADGES=[['b1',3.3],['b2',3.75],['b3',4.2]].map(([id,s])=>{const r=$(id).parentNode.getBoundingClientRect();return [id,s,r.right-62,r.top+r.height/2]});
const CAM=[[0,{x:350,y:1075,s:1.9}],[1.0,{x:350,y:1075,s:1.96},x=>x],[1.7,{x:540,y:960,s:1}],[2.2,{x:540,y:990,s:1.04},out],[2.7,{x:540,y:960,s:1}],
  [5.3,{x:540,y:960,s:1}],[6.2,{x:570,y:1130,s:1.28}],[7.2,{x:570,y:1130,s:1.32},x=>x],[7.7,{x:540,y:960,s:1}]];
const CAPBG='#FCF5EB';

// penanda suara: H.cuesPy()
H.cue('pop',.1); STEPS.forEach(s=>H.cue('tap',s)); H.cue('ting',2.25); H.cue('whoosh',2.6);
[3.3,3.75,4.2].forEach(s=>H.cue('pop',s)); H.cue('whoosh',5.0); H.cue('chime',6.25); H.cue('whoosh',7.4); H.cue('tada',7.5);

window.setT=function(t){
  /* teks */
  if(t<2.6) H.text($('cap'),'Libur ramai,|*tim tetap tenang.*',t,.1,{end:2.6,bg:CAPBG});
  else if(t<5.2) H.text($('cap'),'Kamar penuh?|*Calon tamu tahu sendiri.*',t,2.6,{end:5.2,bg:CAPBG});
  else H.text($('cap'),'Tim fokus melayani|*tamu yang datang.*',t,5.2,{end:7.5,bg:CAPBG});

  /* kamera: buka dengan close-up Rara, mundur saat tamu masuk, zoom ke serah kunci */
  H.cam($('cam'),t,CAM,H.shake(t,2.25,.35,8,4)); SET.paralaks(H.kf(t,CAM)); SET.hidup(t);

  /* ---- Rara ---- */
  const give=H.anticipate(seg(t,5.4,6.2),.12), back2=io(seg(t,6.7,7.2));
  const wave=seg(t,.05,.3)*(1-seg(t,1.0,1.5));
  const armR=-12-wave*(138+Math.sin(t*11)*14)-(give-back2)*128;
  const hopR=H.hop(t,6.3,.42,22), happy=t>6.2&&t<7.3;
  const lookR=t<1.2?[0,0]:(t>2.6&&t<5.2?[3,-5]:[6,0]);
  const faceR={look:lookR,brow:t<1.2?7:(happy?8:3),browTilt:-5,
    ...(t>.25&&t<1.05?T.bicara(t,1):t>2.25&&t<2.6?{mouth:'o',eye:'wide'}:happy?{mouth:'open',eye:'happy'}:{mouth:'smile'})};
  $('gRara').innerHTML=T.rara(RX,RY,RS,T.hidup(t,1,{legs:false,tilt:-5+wave*-3,armL:14,armR,air:hopR.y,squash:[hopR.sx,hopR.sy],
    propR:t>5.4&&t<6.35?T.kunci(armR):'',face:faceR}));

  /* ---- Bimo ---- */
  const walking=t>.3&&t<2.2, gx=bimoX(t), wk=walking?T.jalan(t,12):{};
  const lean=-5*seg(t,.3,.55)*(1-spring(seg(t,2.05,2.8),1.5,4));
  const [lsx,lsy]=H.land(t,2.2,.4,.07), hopB=H.hop(t,6.38,.42,30);
  const tapBell=H.kf(t,[[2.0,0],[2.22,43,out],[2.5,0]]);
  const take=io(seg(t,5.7,6.3)), cheer=seg(t,6.35,6.6)*(1-seg(t,7.1,7.4));
  const armLB=(wk.armL??12)+tapBell+take*128+cheer*22;
  const faceB={look:t>2.6&&t<5.2?[-3,-5]:[-5,0],brow:walking?6:(cheer>0?9:3),browTilt:-4,
    ...(t>2.3&&t<2.62?T.bicara(t,2):cheer>0?{mouth:'open',eye:'happy'}:walking?{mouth:'open',open:.6}:{mouth:'smile'})};
  $('gBimo').innerHTML=T.bimo(gx,BY,BS,T.hidup(t,2,{...wk,tilt:6,lean,armL:armLB,armR:wk.armR??-12,air:hopB.y,
    squash:[lsx*hopB.sx,lsy*hopB.sy],propL:t>=6.35&&t<7.6?T.kunci(armLB):'',face:faceB}));
  $('gKoper').innerHTML=T.koper(gx+150+(bimoX(t-.09)-gx)*.5,FLOOR-144+(walking?Math.abs(Math.sin(t*12+.8))*-6:0),walking?Math.sin(t*12)*3:0);
  STEPS.forEach((s,i)=>H.puff(FX,'puff'+i,t,s,{x:bimoX(s)+(i%2?35:-35),y:FLOOR,size:.9,color:'#C9A777'}));
  H.puff(FX,'puffStop',t,2.2,{x:790,y:FLOOR,size:1.4,color:'#C9A777'});

  /* bel */
  const bd=seg(t,2.25,2.75),[bx,by]=SET.BEL;
  $('Lbell').setAttribute('transform',`translate(${bx},${by}) rotate(${Math.sin(bd*Math.PI*6)*14*(1-bd)}) scale(${H.punch(t,2.25,.3,.2)})`);
  H.ring(FX,'bellRing',t,2.25,{x:bx,y:by-25,r:110});
  H.lines(FX,'bellLines',t,2.25,{x:bx,y:by-28,n:6,r0:58,r1:120,arc:[-165,-15]});

  /* HP + badge */
  const pin=spring(seg(t,2.6,3.4),1.4,5), pout=io(seg(t,5.0,5.4));
  const ph=$('phone'), sh=H.shake(t,4.2,.3,6,9), dim=Math.min(seg(t,2.6,2.9),1-pout);
  const pk=[3.3,3.75,4.2].reduce((a,s)=>a*H.punch(t,s,.25,.025),1);
  ph.style.opacity=Math.min(seg(t,2.6,2.8),1-pout);
  ph.style.transform=`translate(${sh[0]}px,${(1-pin)*160+pout*-80+H.wiggle(t,.5,7,5)+sh[1]}px) rotate(${(1-pin)*-6+H.wiggle(t,.4,1,6)}deg) scale(${(.8+.2*pin)*pk})`;
  BADGES.forEach(([id,s,x,y])=>{const k=elastic(seg(t,s,s+.55));
    $(id).style.transform=`translateY(-50%) scale(${k}) rotate(${(1-k)*-25}deg)`;
    H.ring(TOP,'r'+id,t,s,{x,y,r:80,color:'#FD5B35',dur:.4,w:8});});
  $('scene').style.opacity=1-.5*dim;

  /* serah kunci */
  H.burst(FX,'confetti',t,6.3,{x:575,y:1020,n:24,kind:'mix',spread:170,speed:560,seed:3});
  H.lines(FX,'keyLines',t,6.25,{x:575,y:1060,n:10,r0:80,r1:160,color:'#FFD45C'});

  /* CTA: Bos Jaka masuk membawa kopi dan melambai */
  const cta=$('cta'); H.iris(cta,t,7.4,.5,{x:575,y:1060});
  H.text($('ctaBig'),'Libur ramai,|tim tetap tenang.',t,7.55,{stagger:.08});
  const bk=elastic(seg(t,7.9,8.5));
  $('ctaBtn').style.transform=`scale(${bk*(1+.03*Math.sin((t-8.3)*7)*seg(t,8.3,8.5))})`;
  H.css($('ctaUrl'),{y:(1-out(seg(t,8.1,8.45)))*40,o:seg(t,8.1,8.35)});
  $('ctaSm').style.opacity=.75*seg(t,8.3,8.6);
  if(t>7.4){
    const jw=t<8.3, jx=lerp(1300,540,out(seg(t,7.55,8.3))), jk=jw?T.jalan(t,13):{};
    const hj=H.hop(t,8.35,.36,20), wv=seg(t,8.3,8.5);
    const aR=(jk.armR??-12)*(1-wv)+wv*(-150+Math.sin(t*12)*14), aL=30;
    $('gJaka').innerHTML=T.jaka(jx,1235,1.2,T.hidup(t,3,{...jk,armL:aL,armR:aR,tilt:4,lean:jw?-4:0,air:hj.y,squash:[hj.sx,hj.sy],
      propL:T.cangkir(aL,t),face:{look:[-3,0],brow:6,eye:wv>0?'happy':'normal',mouth:'open',open:wv>0?1:.5}}));
  } else $('gJaka').innerHTML='';
};
window.setT(0);
</script></body></html>
