<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf);font-weight:400}
:root{--navy:#16202A;--cream:#FCF5EB;--teal:#15787D;--tealdk:#13343B;--orange:#FD5B35;--yellow:#FFD45C;--ink:#173336;--green:#2DBE78;--lilac:#B58BF5;--blue:#3B4CCA}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;font-family:P;background:var(--cream)}
.page{position:absolute;inset:0;background:var(--cream);
  background-image:radial-gradient(rgba(23,51,54,.09) 2.2px,transparent 2.6px);background-size:22px 22px}
.hdr{position:absolute;top:44px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:28px;color:var(--teal);z-index:30}
.hdr .dot{color:var(--orange);margin-right:10px}
.hdr .num{color:#7a8580}
.ftr{position:absolute;bottom:42px;left:60px;right:60px;display:flex;justify-content:space-between;font-weight:700;font-size:26px;color:#6b7672;z-index:30}
.ttl{position:absolute;top:118px;left:60px;right:60px;display:flex;align-items:center;gap:22px;z-index:20}
.ttl .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:60px;display:flex;align-items:center;justify-content:center;border:6px solid var(--navy);box-shadow:6px 6px 0 var(--navy)}
.ttl .t{font-weight:700;font-size:54px;line-height:1.08;color:var(--ink)}
.panel{position:absolute;left:60px;width:960px;border:7px solid var(--navy);border-radius:14px;overflow:hidden;box-sizing:border-box;box-shadow:10px 10px 0 var(--navy)}
.panel svg{position:absolute;inset:0}
.narr{position:absolute;top:0;left:0;background:var(--yellow);border-right:6px solid var(--navy);border-bottom:6px solid var(--navy);padding:10px 22px;font-weight:700;font-size:30px;color:var(--navy);z-index:5}
.bub{position:absolute;background:#fff;border:6px solid var(--navy);border-radius:40px;padding:20px 28px;font-weight:700;font-size:34px;line-height:1.2;color:var(--navy);z-index:6;box-sizing:border-box}
.bub::after,.bub::before{content:"";position:absolute;width:0;height:0;border-style:solid}
.bub.bl::before{left:60px;bottom:-40px;border-width:40px 0 0 34px;border-color:var(--navy) transparent transparent transparent}
.bub.bl::after{left:67px;bottom:-29px;border-width:30px 0 0 24px;border-color:#fff transparent transparent transparent}
.bub.br::before{right:60px;bottom:-40px;border-width:40px 34px 0 0;border-color:var(--navy) transparent transparent transparent}
.bub.br::after{right:67px;bottom:-29px;border-width:30px 24px 0 0;border-color:#fff transparent transparent transparent}
.think{position:absolute;background:#fff;border:6px dashed var(--navy);border-radius:60px;padding:20px 28px;font-weight:700;font-size:32px;line-height:1.2;color:var(--navy);z-index:6;box-sizing:border-box}
.sfx{position:absolute;font-weight:700;font-style:italic;font-size:76px;color:var(--yellow);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;text-shadow:6px 6px 0 var(--navy);z-index:7;letter-spacing:2px}
.board{position:absolute;background:#fff;border:6px solid var(--navy);border-radius:18px;padding:14px 22px;font-weight:700;color:var(--ink);z-index:4;box-shadow:6px 6px 0 var(--navy)}
.geser{display:inline-block;background:var(--yellow);color:var(--navy);border:6px solid var(--navy);border-radius:60px;padding:14px 44px;font-weight:700;font-size:44px;box-shadow:6px 6px 0 var(--navy)}
</style></head><body><div class="page" id="page"></div>
<script>
const NAVY='#16202A', O=`stroke="${NAVY}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"`;
function arm(x,y,ang,len,col,skin,prop=''){return `<g transform="translate(${x},${y}) rotate(${ang})"><rect x="-24" y="-10" width="48" height="${len+10}" rx="24" fill="${col}" ${O}/><g transform="translate(0,${len})"><circle r="27" fill="${skin}" ${O}/>${prop}</g></g>`}
function face(e,ink='#2B2321',glasses=false){
  let eyes='',mouth='',extra='';
  if(e==='happy'){eyes=`<path d="M-44 10 Q-30 -8 -16 10 M16 10 Q30 -8 44 10" stroke="${ink}" stroke-width="8" fill="none" stroke-linecap="round"/>`}
  else if(e==='shock'){eyes=`<circle cx="-30" cy="4" r="19" fill="#fff" ${O}/><circle cx="30" cy="4" r="19" fill="#fff" ${O}/><circle cx="-30" cy="6" r="6" fill="${ink}"/><circle cx="30" cy="6" r="6" fill="${ink}"/>`}
  else if(e==='squint'){eyes=`<path d="M-44 6 L-16 6 M16 6 L44 6" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>`}
  else {eyes=`<ellipse cx="-30" cy="5" rx="10" ry="13" fill="${ink}"/><ellipse cx="30" cy="5" rx="10" ry="13" fill="${ink}"/>`}
  if(e==='worried'||e==='squint'||e==='shock'){extra+=`<path d="M-50 -24 L-14 -32 M14 -32 L50 -24" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`}
  if(e==='happy'||e==='grin'){mouth=`<path d="M-30 30 Q0 78 30 30 Z" fill="${ink}"/><path d="M-16 48 Q0 66 16 48" fill="#FD7A5C"/>`}
  else if(e==='shock'){mouth=`<ellipse cx="0" cy="46" rx="16" ry="20" fill="${ink}"/>`}
  else if(e==='worried'||e==='squint'){mouth=`<path d="M-24 46 Q-12 36 0 46 Q12 56 24 46" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/>`}
  else {mouth=`<path d="M-26 36 Q0 58 26 36" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/>`}
  let cheeks=`<circle cx="-56" cy="32" r="13" fill="#FD5B35" opacity=".3"/><circle cx="56" cy="32" r="13" fill="#FD5B35" opacity=".3"/>`;
  let g=glasses?`<g stroke="${NAVY}" stroke-width="7" fill="#fff" fill-opacity=".2"><circle cx="-31" cy="6" r="26"/><circle cx="31" cy="6" r="26"/><line x1="-5" y1="4" x2="5" y2="4"/></g>`:'';
  return cheeks+eyes+extra+mouth+g;
}
function rara(x,y,s,o={}){
  const skin='#C98B5F', col='#15787D', e=o.e||'smile';
  const aR=o.armR??10, aL=o.armL??-10;
  return `<g transform="translate(${x},${y}) scale(${s*(o.flip?-1:1)},${s})">
   <path d="M-112 -20 C-118 -122 118 -122 112 -20 L120 66 L98 56 L110 112 L84 92 L86 132 L-86 132 L-84 92 L-110 112 L-98 56 L-120 66 Z" fill="#B58BF5" ${O}/>
   <rect x="-122" y="105" width="244" height="400" rx="80" fill="${col}" ${O}/>
   <path d="M-34 108 L0 160 L34 108 Z" fill="#fff" ${O}/>
   <rect x="-80" y="200" width="70" height="30" rx="6" fill="#FFD45C" ${O}/>
   ${arm(-112,150,aL,170,col,skin,o.propL||'')}
   ${arm(112,150,aR,170,col,skin,o.propR||'')}
   <rect x="-18" y="70" width="36" height="45" fill="${skin}" ${O}/>
   <circle r="90" fill="${skin}" ${O}/>
   <path d="M-100 -6 C-98 -116 98 -116 100 -6 C86 -58 36 -76 10 -46 L0 -24 L-10 -46 C-36 -76 -86 -58 -100 -6 Z" fill="#B58BF5" ${O}/>
   <path d="M-56 -74 C-26 -98 22 -98 50 -82" stroke="#E4CCFF" stroke-width="10" fill="none" stroke-linecap="round"/>
   <circle cx="-92" cy="50" r="16" fill="none" stroke="#FFD45C" stroke-width="7"/><circle cx="92" cy="50" r="16" fill="none" stroke="#FFD45C" stroke-width="7"/>
   <g transform="scale(${o.flip?-1:1},1)">${face(e)}</g></g>`}
function bimo(x,y,s,o={}){
  const skin='#8D5A3B', col='#3B4CCA', e=o.e||'smile';
  const aR=o.armR??10, aL=o.armL??-10;
  let curls=[[-74,-44,30],[-54,-82,32],[-16,-102,32],[24,-102,32],[60,-82,32],[78,-44,30],[-30,-60,28],[12,-68,30],[46,-56,26]].map(([a,b,r])=>`<circle cx="${a}" cy="${b}" r="${r}"/>`).join('');
  return `<g transform="translate(${x},${y}) scale(${s*(o.flip?-1:1)},${s})">
   <rect x="-118" y="105" width="236" height="400" rx="80" fill="${col}" ${O}/>
   <path d="M-40 108 Q0 140 40 108" fill="none" ${O}/>
   ${arm(-108,150,aL,170,col,skin,o.propL||'')}
   ${arm(108,150,aR,170,col,skin,o.propR||'')}
   <rect x="-17" y="70" width="34" height="45" fill="${skin}" ${O}/>
   <circle r="86" fill="${skin}" ${O}/>
   <g fill="#F4A259" ${O}>${curls}</g>
   <g fill="#F4A259">${curls}</g>
   <g fill="#FFD08A"><circle cx="-20" cy="-114" r="10"/><circle cx="32" cy="-110" r="8"/><circle cx="-62" cy="-94" r="8"/></g>
   <circle cx="86" cy="42" r="7" fill="#E8E8E8" ${O}/>
   <g transform="scale(${o.flip?-1:1},1)">${face(e,'#1E1A19',true)}</g></g>`}
function jaka(x,y,s,o={}){
  const skin='#E0A776', col='#FD5B35', e=o.e||'smile';
  const aR=o.armR??10, aL=o.armL??-10;
  const leaves=[[-70,180],[40,170],[-20,260],[70,280],[-80,330],[10,360]].map(([a,b])=>`<ellipse cx="${a}" cy="${b}" rx="22" ry="11" transform="rotate(-30 ${a} ${b})" fill="#FFD45C"/>`).join('');
  return `<g transform="translate(${x},${y}) scale(${s*(o.flip?-1:1)},${s})">
   <rect x="-128" y="105" width="256" height="400" rx="80" fill="${col}" ${O}/>
   ${leaves}
   <path d="M-40 108 L0 150 L40 108" fill="#fff" ${O}/>
   ${arm(-118,150,aL,170,col,skin,o.propL||'')}
   ${arm(118,150,aR,170,col,skin,o.propR||'')}
   <rect x="-18" y="70" width="36" height="45" fill="${skin}" ${O}/>
   <circle r="92" fill="${skin}" ${O}/>
   <path d="M-98 -4 C-116 -110 -36 -178 52 -164 C128 -150 136 -70 98 -4 C94 -52 66 -70 30 -72 C-10 -76 -62 -66 -82 -38 Z" fill="#2B2321" ${O}/>
   <path d="M0 -150 C40 -146 84 -122 96 -84" stroke="#D9D9D9" stroke-width="12" fill="none" stroke-linecap="round"/>
   <g transform="scale(${o.flip?-1:1},1)">${face(e)}
   <path d="M-40 30 Q-20 18 0 26 Q20 18 40 30 Q20 40 0 34 Q-20 40 -40 30 Z" fill="#2B2321"/></g></g>`}
// props (drawn in hand space, hand at 0,0)
function phone(kind,rot=0){
  let scr='';
  if(kind==='chat') scr=`<rect x="-30" y="-58" width="50" height="14" rx="7" fill="#15787D"/><rect x="-20" y="-36" width="50" height="14" rx="7" fill="#ccc"/><rect x="-30" y="-14" width="44" height="14" rx="7" fill="#15787D"/>`;
  else if(kind==='cal') scr=`<rect x="-32" y="-60" width="64" height="16" rx="4" fill="#e9dcc8"/><rect x="-32" y="-38" width="64" height="16" rx="4" fill="#2DBE78"/><rect x="-32" y="-16" width="64" height="16" rx="4" fill="#e9dcc8"/>`;
  else if(kind==='dark') scr=`<rect x="-34" y="-66" width="68" height="70" fill="#2a2a33"/><rect x="-14" y="-40" width="30" height="20" fill="#3b3b46"/>`;
  else if(kind==='qr') scr=`<g fill="#16202A"><rect x="-28" y="-62" width="20" height="20"/><rect x="8" y="-62" width="20" height="20"/><rect x="-28" y="-26" width="20" height="20"/><rect x="0" y="-30" width="8" height="8"/><rect x="14" y="-18" width="8" height="8"/><rect x="0" y="-44" width="8" height="8"/></g>`;
  else if(kind==='cam') scr=`<rect x="-34" y="-66" width="68" height="70" fill="#BFE3E0"/><rect x="-20" y="-40" width="40" height="26" fill="#f6b98a"/>`;
  return `<g transform="rotate(${rot}) translate(0,-20)"><rect x="-46" y="-90" width="92" height="160" rx="16" fill="${NAVY}" ${O}/><rect x="-36" y="-76" width="72" height="126" rx="8" fill="#fff"/><g transform="translate(0,10)">${scr}</g></g>`}
function mug(){return `<g transform="translate(0,-30)"><rect x="-30" y="-40" width="60" height="70" rx="10" fill="#fff" ${O}/><path d="M30 -24 Q56 -20 52 0 Q48 16 30 14" fill="none" ${O}/><path d="M-12 -56 Q-4 -70 -12 -84 M10 -56 Q18 -70 10 -84" stroke="#9aa" stroke-width="5" fill="none"/></g>`}
function star(x,y,r,c='#FFD45C'){const p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p.push((x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}" ${O}/>`}
function burst(x,y,r,c){const p=[];for(let i=0;i<24;i++){const a=Math.PI/12*i,rr=i%2?r*.72:r;p.push((x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}"/>`}
function rays(cx,cy,c){let s='';for(let i=0;i<18;i++){const a=i*20*Math.PI/180;s+=`<polygon points="${cx},${cy} ${cx+Math.cos(a)*1400},${cy+Math.sin(a)*1400} ${cx+Math.cos(a+.17)*1400},${cy+Math.sin(a+.17)*1400}" fill="${c}"/>`}return s}

function panel(top,h,bg,svg,html='',narr=''){
  return `<div class="panel" style="top:${top}px;height:${h}px;background:${bg}"><svg width="946" height="${h-14}" viewBox="0 0 946 ${h-14}">${svg}</svg>${narr?`<div class="narr">${narr}</div>`:''}${html}</div>`}
const HDR=n=>`<div class="hdr"><div><span class="dot">●</span>IG · TikTok @tk.penginapan</div><div class="num">${n}</div></div>`;
const FTR=`<div class="ftr"><div>titikkumpul.id/layanan-penginapan</div><div>Geser →</div></div>`;
const TTL=(n,t)=>`<div class="ttl"><div class="n">${n}</div><div class="t">${t}</div></div>`;

 <div style="position:absolute;inset:0;background:${NAVY}"></div>
 <svg width="1080" height="1350" style="position:absolute;inset:0">${rays(540,860,'rgba(255,255,255,.05)')}${burst(540,860,430,'#FD5B35')}${burst(540,860,370,'#FFD45C')}

   <div style="font-weight:700;font-style:italic;font-size:108px;line-height:1;color:#fff;margin-top:22px;-webkit-text-stroke:0;text-shadow:7px 7px 0 #FD5B35">Libur Nataru<br>datang!</div>

 </div>`;
