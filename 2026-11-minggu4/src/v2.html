<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
function caption(html){const c=$('cap'); if(c.dataset.h!==html){c.innerHTML=html;c.dataset.h=html;}}
const CAPS=[[0,'Foto kamar pakai HP,<br><span class="hl">cukup 15 detik.</span>'],
 [2.8,'<span class="pill">Tips 1</span><br>Buka tirai,<br><span class="hl">pakai cahaya jendela.</span>'],
 [6.6,'<span class="pill">Tips 2</span><br>Foto dari pojok,<br><span class="hl">kamar terlihat luas.</span>'],
 [10.4,'<span class="pill">Tips 3</span><br>HP lurus,<br><span class="hl">dinding tidak miring.</span>'],
 [14.0,'Pasang di halaman pesan,<br><span class="hl">tamu langsung pesan.</span>']];
window.setT=function(t){
  let k=0; CAPS.forEach((c,i)=>{if(t>=c[0])k=i}); caption(CAPS[k][1]);
  const cs=seg(t,CAPS[k][0]+.1,CAPS[k][0]+.6); const c=$('cap'); c.style.opacity=cs; c.style.transform=`translateY(${(1-back(cs))*40}px) scale(${.9+.1*back(cs)})`;
  c.style.top=k>0&&k<4?'190px':'250px';
  // rara small
  $('r_staffBody').setAttribute('transform',`translate(0,${Math.sin(t*2.2)*4})`);
  const blink=(t%2.8)>2.65?0.1:1; $('r_staffEyes').setAttribute('transform',`translate(0,5) scale(1,${blink}) translate(0,-5)`);
  $('r_staffHead').setAttribute('transform',`translate(0,1170) rotate(${Math.sin(t*1.3)*4})`);
  const sw=Math.sin(t*2.6)*2.5; $('r_staffHairBack').setAttribute('transform',`rotate(${sw})`); $('r_staffBangs').setAttribute('transform',`rotate(${sw*.4})`);
  // Rara points to phone at each tip
  const pt=[2.9,6.7,10.5,14.1].reduce((a,s)=>Math.max(a,io(seg(t,s,s+.4))*(1-io(seg(t,s+1.6,s+2.0)))),0);
  $('r_staffArm').setAttribute('transform',`translate(95,1300) rotate(${-pt*110})`);
  const talk=(t>2.8&&t<17.4)?Math.abs(Math.sin(t*9))*pt:0;
  $('r_staffMouth').setAttribute('d',`M-26 38 Q0 ${58+talk*10} 26 38`);
  // phone in
  const pin=back(seg(t,0,.5)); $('ph').style.transform=`translateY(${(1-pin)*140}px)`; $('ph').style.opacity=seg(t,0,.25);
  // tip1: curtains open 3.4-4.6, brightness
  const op=io(seg(t,3.4,4.6)); $('curL').setAttribute('x',290-op*95); $('curL').setAttribute('width',110-op*80); $('curR').setAttribute('x',400+op*95-0); $('curR').setAttribute('width',110-op*80);
  $('dim').setAttribute('opacity',.6*(1-op)); $('beam').setAttribute('opacity',.45*op);
  // tip2: corner view: before 6.6 close-up (scale 1.7 shifted), after transition 7.2-8.4 -> 1
  const z=io(seg(t,7.2,8.4)); const sc=t<6.6?1.0:1.0; let S=1, tx=0, ty=0;
  if(t<6.6){S=1.55;tx=-120;ty=-180} else {S=1.55-.55*z; tx=-120*(1-z); ty=-180*(1-z)}
  // tip3: tilt before 10.4, straighten 11.0-12.0
  const st=io(seg(t,11.0,12.0)); const rot=t<10.4?-7:-7*(1-st);
  const rotA=t<2.8?-7:rot;
  $('rg').setAttribute('transform',`translate(282,380) rotate(${rotA}) scale(${S}) translate(${-282+tx/S},${-380+ty/S})`);
  $('grid').style.opacity=seg(t,10.6,10.9)*(1-seg(t,13.6,13.9));
  // check/cross marks
  const marks=[[0.9,2.6,'no'],[4.7,6.3,'ok'],[8.5,10.1,'ok'],[12.1,13.7,'ok']];
  let okS=0,noS=0; marks.forEach(([a,b,id])=>{const v=back(seg(t,a,a+.3))*(1-seg(t,b,b+.2)); if(id=='ok')okS=Math.max(okS,v); else noS=Math.max(noS,v)});
  $('ok').style.transform=`scale(${okS})`; $('no').style.transform=`scale(${noS})`;
  // shutter + flash at 12.8
  $('sh').style.transform=`scale(${1-.15*Math.sin(Math.PI*seg(t,12.75,12.95))})`; $('fl').style.opacity=.9*(seg(t,12.8,12.85)*(1-seg(t,12.85,13.2)));
  // app 14.0+
  if(t>=13.9&&!$('thumb').dataset.d){$('thumb').innerHTML=$('room').innerHTML.replace('id="rg"','').replace(/id="[^"]+"/g,'');$('thumb').dataset.d=1}
  const ap=seg(t,14.0,14.4); $('app').style.opacity=ap; $('app').style.transform=`translateY(${(1-io(ap))*60}px)`;
  $('pesan').style.transform=`scale(${1-.06*Math.sin(Math.PI*seg(t,15.8,16.1))})`;
  $('star').setAttribute('opacity',seg(t,16.0,16.3)*(1-seg(t,17.0,17.3)));
  const ct=io(seg(t,17.4,17.9)); $('cta').style.opacity=ct; $('cta').style.transform=`translateY(${(1-ct)*80}px)`;
};
window.setT(0);
</script></body></html>
